version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/careerpilot
      - JWT_SECRET=careerpilot_super_production_secret_key_2026
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost:5173
      - CLOUDINARY_NAME=
      - CLOUDINARY_KEY=
      - CLOUDINARY_SECRET=
    depends_on:
      - mongodb
    networks:
      - careerpilot_network

  mongodb:
    image: mongo:7.0
    container_name: careerpilot_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=careerpilot
    volumes:
      - mongodb_data:/data/db
    networks:
      - careerpilot_network

volumes:
  mongodb_data:
    driver: local

networks:
  careerpilot_network:
    driver: bridge
